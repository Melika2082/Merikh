<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>فرار از مربع‌ها</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>🎮 فرار از مربع‌ها</h1>

        <div class="info">
            <div>
                امتیاز:
                <span id="score">0</span>
            </div>

            <div>
                زمان:
                <span id="time">30</span>
            </div>
        </div>

        <div id="game">

            <div id="player"></div>

        </div>

        <button id="startButton">
            شروع بازی
        </button>

        <p class="instruction">
            با کلیدهای جهت‌دار حرکت کن و از مربع‌های قرمز فرار کن!
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
